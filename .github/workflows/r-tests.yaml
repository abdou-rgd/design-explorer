name: R tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-4-2:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.2.0"

      - uses: r-lib/actions/setup-renv@v2

      - name: Verify locked runtime
        shell: Rscript {0}
        run: |
          expected <- c(
            shiny = "1.7.1", bslib = "0.3.1", DT = "0.23",
            ggplot2 = "3.3.6", dplyr = "1.0.9", tidyr = "1.2.0",
            stringr = "1.4.0", purrr = "0.3.4", readr = "2.1.2",
            tibble = "3.1.7", scales = "1.2.0", rlang = "1.0.2",
            testthat = "3.1.4", withr = "2.5.0", mrgsolve = "1.0.3",
            renv = "1.1.5"
          )
          actual <- vapply(
            names(expected),
            function(package) as.character(packageVersion(package)),
            character(1)
          )
          stopifnot(
            getRversion() == numeric_version("4.2.0"),
            identical(actual, expected)
          )

      - name: Run test suite
        run: Rscript tests/run_tests.R

      - name: Load Shiny application
        shell: Rscript {0}
        run: |
          app <- source(
            file.path("app", "app.R"),
            local = new.env(parent = globalenv()),
            chdir = TRUE
          )$value
          stopifnot(inherits(app, "shiny.appobj"))
